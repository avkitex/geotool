[project]
name = "geotool"
version = "0.1.0"
description = "Search, download, and harmonize GEO expression cohorts"
requires-python = ">=3.9"
dependencies = [
    "GEOparse>=2.0.3",
    "requests>=2.28",
    "pandas>=1.5",
    "click>=8.1",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "anthropic>=0.69",
    "pydantic>=2.0",
    # required by geotool/_vendor/inmoose (vendored subset of InMoose's
    # limma port -- see geotool/_vendor/inmoose/README.md), which
    # geotool.diffexp delegates to.
    "scipy>=1.16",
    "patsy>=1.0",
    "statsmodels>=0.14.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests-mock>=1.10",
]
notebook = [
    "jupyter>=1.0",
]

[project.scripts]
geotool = "geotool.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geotool*"]
